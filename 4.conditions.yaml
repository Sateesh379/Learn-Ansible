- name: check number is odd or even
  hosts: localhost
  connection: local
  vars:
    number:25
  tasks:
  - name: check number is odd or even
    debug:
      msg: number is even
      when: number % 2 == 0

    - name: check number is odd or even
      debug:
       msg: number is odd
       when: number % 2 != 0
  