- name: Course Details
  hosts: localhost
  connection: local
  vars:
     course: Devops+AIOps and DevSecops
     duration: 4months
     is_live_sessions: true
     topics:
      - Ansible
      - Docker
      - Linux
      - ShellScripting
      - kubernetes
     moredetails:
      trainer: Sateesh
      exact_duration_in_months: 4.5
  tasks:
  - name: print Course details
    debug:
      msg: |
       course name: {{course}} : {{course | type_debug}}
       duration: {{duration}} : {{duration | type_debug}}
       live session: {{is_live_sessions}} : {{is_live_sessions | type_debug}}
       topics: {{topics}} : {{topics | type_debug}}
       trainer name: {{moredetails.trainer}} : {{moredetails.trainer | type_debug}}
       Total duration: {{moredetails.exact_duration_in_months}} : {{moredetails.exact_duration_in_months | type_debug}}