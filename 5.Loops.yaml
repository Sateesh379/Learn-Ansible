- name: install applications
  hosts: localhost
  connection: local
  become: yes
   
- name: installing
  tasks:
   debug:
    msg: "installing {{ item }}"
  vars:
   list:
    - git
    - mysql
    - nginx
    - apache2
  tasks:
  - name: install applications
    package:
      name: "{{ item}}"
      state: present
  loop: "{{ list }}"
