- name: print facts
  hosts: localhost
  connection: local
  tasks:
   - name: print the facts
     debug:
      msg: "{{ ansible_facts }}"

   - name: Print system os details
     debug:
       msg: |
        OS Family: "{{ansible_facts ['os_family']}}"
        IP Address: "{{ansible_facts ['default_ipv4']['address']}}"
        IP address: "{{ansible_facts.default_ipv4.address}}"